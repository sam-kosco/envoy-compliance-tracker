name: TEMP Closeout Q27 Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Round-trip test — POST identical fields value back
        env:
          JOTFORM_KEY: ${{ secrets.JOTFORM_KEY }}
        run: |
          pip -q install requests
          python3 - << 'PYEOF'
          import os, sys, requests
          base = "https://foxtrotaviation.jotform.com/API"
          url  = f"{base}/form/222916060752150/question/27"
          key  = os.environ["JOTFORM_KEY"]

          before = requests.get(f"{url}?apiKey={key}", timeout=30)
          before.raise_for_status()
          fields_before = before.json()["content"]["fields"]
          print(f"BEFORE: {len(fields_before)} chars, {fields_before.count(chr(10))+1} lines")

          r = requests.post(f"{url}?apiKey={key}",
                            data={"question[fields]": fields_before}, timeout=30)
          r.raise_for_status()
          print(f"POST status: {r.status_code}")

          after = requests.get(f"{url}?apiKey={key}", timeout=30)
          after.raise_for_status()
          fields_after = after.json()["content"]["fields"]
          print(f"AFTER:  {len(fields_after)} chars, {fields_after.count(chr(10))+1} lines")

          if fields_after == fields_before:
              print("IDENTICAL — write path is lossless")
          else:
              print("MISMATCH!")
              for i, (a, b) in enumerate(zip(fields_before.splitlines(), fields_after.splitlines())):
                  if a != b:
                      print(f"line {i} before: {a[:120]}")
                      print(f"line {i} after:  {b[:120]}")
              sys.exit(1)
          PYEOF
