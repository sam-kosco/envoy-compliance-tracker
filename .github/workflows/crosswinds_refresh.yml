name: Crosswinds Compliance Data Refresh

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON array of inspection records from Power Automate"
        required: true
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Run Crosswinds data relay
        env:
          PAYLOAD:       ${{ github.event.inputs.payload }}
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python crosswinds_generate_data.py

      - name: Commit and push crosswinds_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crosswinds_data.json
          git diff --cached --quiet || git commit -m "chore: refresh crosswinds_data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
