name: Envoy Compliance Data Refresh

on:
  schedule:
    # Runs every hour at :00
    # Comment out the two lines below to pause scheduled refreshes
    - cron: "7 * * * *"
  workflow_dispatch:
    # Always available for manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data.json back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Check source freshness
        id: src
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python3 check_source_modified.py "Power Flows/Debriefs/Envoy Debriefs.xlsx" refresh_state/envoy.mtime

      - name: Set up Python
        if: steps.src.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.src.outputs.changed == 'true'
        run: pip install openpyxl requests

      - name: Run data relay
        if: steps.src.outputs.changed == 'true'
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python envoy_generate_data.py

      - name: Record source watermark
        if: steps.src.outputs.changed == 'true'
        run: |
          mkdir -p refresh_state
          printf '%s' "${{ steps.src.outputs.mtime }}" > refresh_state/envoy.mtime

      - name: Commit and push data.json
        if: steps.src.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json refresh_state/envoy.mtime
          git diff --cached --quiet || git commit -m "chore: refresh data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          n=0
          until git push; do
            n=$((n+1)); [ "$n" -ge 3 ] && exit 1
            echo "push rejected (concurrent bot commit) — rebasing and retrying ($n/3)"
            git pull --rebase
          done
