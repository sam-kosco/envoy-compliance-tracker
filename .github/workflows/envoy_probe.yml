name: TEMP Envoy Forms Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe closeout tail questions
        env:
          JOTFORM_KEY: ${{ secrets.JOTFORM_KEY }}
        run: |
          pip -q install requests
          python3 - << 'PYEOF'
          import os, json, re, requests
          key = os.environ["JOTFORM_KEY"]
          base = "https://foxtrotaviation.jotform.com/API"

          FORMS = [
              ("Commercial Closeout 2.0", "222916060752150"),
              ("XNA Closeout", "261954357644972"),
              ("SGF Closeout", "261954499086979"),
              ("CMH Closeout", "261664495134058"),
              ("LIT Closeout", "261955038475971"),
          ]
          for label, fid in FORMS:
              r = requests.get(f"{base}/form/{fid}/questions?apiKey={key}", timeout=30)
              r.raise_for_status()
              print(f"=== {label} ({fid}) ===")
              for qid, q in sorted(r.json()["content"].items(), key=lambda x: int(x[0])):
                  blob = json.dumps(q)
                  n = len(re.findall(r'N\d{3}[A-Z]{2}', blob))
                  if n > 20:
                      print(f"QID {qid} type={q.get('type')} text={(q.get('text') or '')[:40]!r} tails~{n}")
                      for prop in ("options", "fields"):
                          v = q.get(prop)
                          if isinstance(v, str) and v:
                              lines = v.replace("\r\n", "\n").split("\n")
                              for ln in lines:
                                  hits = len(re.findall(r'N\d{3}[A-Z]{2}', ln))
                                  print(f"  {prop} line (tails~{hits}): {ln[:150]} ....... {ln[-90:]}" if hits > 20
                                        else f"  {prop} line: {ln[:150]}")
          PYEOF
