name: Reconcile Envoy Tail Lists

# Audits every Envoy tail list (8 JotForm lists + SafetyCulture "Envoy Tails")
# against the Envoy Debriefs Tail List roster; apply=true rewrites out-of-sync
# lists to exactly the roster (numeric order, placeholders preserved).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = fix out-of-sync lists; false = audit only"
        required: false
        default: "false"
        type: string

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Reconcile
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          JOTFORM_KEY: ${{ secrets.JOTFORM_KEY }}
          SAFETYCULTURE_KEY: ${{ secrets.SAFETYCULTURE_KEY }}
          APPLY: ${{ github.event.inputs.apply }}
        run: python envoy_tail_reconcile.py
