name: TEMP extras flight history probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Flight history for the three extra tails
        env:
          AERO_API_KEY: ${{ secrets.AERO_API_KEY }}
        run: |
          pip -q install requests
          python3 - << 'PYEOF'
          import os, time, requests
          from datetime import datetime, timedelta, timezone
          S = requests.Session(); S.headers["x-apikey"] = os.environ["AERO_API_KEY"].strip()
          BASE = "https://aeroapi.flightaware.com/aeroapi"
          now = datetime.now(timezone.utc)
          start = (now - timedelta(hours=96)).strftime("%Y-%m-%dT%H:%M:%SZ")
          end   = (now + timedelta(hours=2)).strftime("%Y-%m-%dT%H:%M:%SZ")
          for tail in ("N512AE", "N572NN", "N725PS"):
              r = S.get(f"{BASE}/flights/{tail}",
                        params={"ident_type": "registration", "start": start, "end": end}, timeout=30)
              r.raise_for_status()
              flights = r.json().get("flights", [])
              print(f"=== {tail}: {len(flights)} flights in past 96h ===")
              for f in sorted(flights, key=lambda x: x.get("scheduled_out") or ""):
                  o = (f.get("origin") or {}); d = (f.get("destination") or {})
                  print(f"  {f.get('ident')} {o.get('code_iata') or o.get('code')}->"
                        f"{d.get('code_iata') or d.get('code')} "
                        f"out={f.get('actual_out') or f.get('scheduled_out')} "
                        f"in={f.get('actual_in') or f.get('estimated_in') or f.get('scheduled_in')} "
                        f"status={f.get('status')!r} cancelled={f.get('cancelled')}")
              time.sleep(8)
          PYEOF
