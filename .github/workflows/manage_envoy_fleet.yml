name: Manage Envoy Fleet

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform: add_tail | remove_tail"
        required: true
        type: string
      tail:
        description: "Tail number (dashboard normalizes + validates; workflow re-checks defensively)"
        required: true
        type: string

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fleet action
        env:
          ACTION:       ${{ github.event.inputs.action }}
          TAIL_INPUT:   ${{ github.event.inputs.tail }}
          JOTFORM_KEY:  ${{ secrets.JOTFORM_KEY }}
          JOTFORM_BASE: https://foxtrotaviation.jotform.com/API
          # SafetyCulture "Envoy Tails" global response set (shares the repo's
          # SAFETYCULTURE_KEY with manage_fleet.yml / the Crosswinds refresh).
          SAFETYCULTURE_KEY:  ${{ secrets.SAFETYCULTURE_KEY }}
          ENVOY_TAILS_SET_ID: responseset_00749b53e9c34c618ee08f3e3e29f014
          # SharePoint Tail List row: Power Automate "When an HTTP request is
          # received" flows — add appends the row (Status=Active), remove sets
          # Status=Disabled. Body is {"tail": "<N-number>"}. The URLs carry their
          # own SAS signature, so they live in repo secrets, never in this file.
          ENVOY_ROSTER_ADD_URL:    ${{ secrets.ENVOY_ROSTER_ADD_URL }}
          ENVOY_ROSTER_REMOVE_URL: ${{ secrets.ENVOY_ROSTER_REMOVE_URL }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, sys
          from datetime import datetime, timezone
          import requests

          action = os.environ["ACTION"].strip()
          tail   = os.environ["TAIL_INPUT"].strip().upper()

          if action not in ("add_tail", "remove_tail"):
              print(f"Unsupported action: {action}", file=sys.stderr); sys.exit(1)
          if not re.match(r'^N\d{1,5}[A-Z]{0,2}$', tail):
              print(f"Invalid tail format: {tail!r}", file=sys.stderr); sys.exit(1)

          adding = action == "add_tail"
          print(f"Action: {action}  |  Tail: {tail}")

          KEY  = os.environ["JOTFORM_KEY"]
          BASE = os.environ["JOTFORM_BASE"]

          def sort_key(t):
              # Numeric portion after 'N' first (so N205 lands between N204 and
              # N206, not after N1999); non-N entries sort to the end.
              m = re.match(r'^N(\d+)', t.upper())
              return (0, int(m.group(1)), t.upper()) if m else (1, 0, t.upper())

          def dedupe(options):
              """Trim + case-insensitive dedupe, original order preserved."""
              seen, out = set(), []
              for o in options:
                  o = o.strip()
                  if o and o.upper() not in seen:
                      seen.add(o.upper()); out.append(o)
              return out

          def apply_options(cleaned):
              """(new_list, message, changed) for the current action, keeping a
              NOT LISTED entry (any casing) last. add_tail inserts numeric-sorted;
              remove_tail drops the tail. noop when already in the desired state."""
              nl = next((o for o in cleaned if o.upper() == "NOT LISTED"), None)
              others = [o for o in cleaned if o.upper() != "NOT LISTED"]
              present = tail in (o.upper() for o in others)
              if adding:
                  if present:
                      return None, f"already present ({len(others)} tails)", False
                  others.append(tail); others.sort(key=sort_key)
                  final = others + ([nl] if nl else [])
                  return final, f"added at position {others.index(tail) + 1} of {len(final)}", True
              if not present:
                  return None, "not present", False
              others = [o for o in others if o.upper() != tail]
              final = others + ([nl] if nl else [])
              return final, f"removed ({len(others)} tails remain)", True

          # ── Target kind 1: plain dropdown question (pipe-separated options) ──
          def do_dropdown(form_id, qid, _label=None):
              url = f"{BASE}/form/{form_id}/question/{qid}?apiKey={KEY}"
              r = requests.get(url, timeout=30); r.raise_for_status()
              opts_raw = r.json().get("content", {}).get("options", "")
              final, msg, changed = apply_options(dedupe(opts_raw.split("|") if opts_raw else []))
              if not changed:
                  return {"status": "noop", "message": msg}
              r = requests.post(url, data={"question[options]": "|".join(final)}, timeout=30)
              r.raise_for_status()
              return {"status": "ok", "message": msg}

          # ── Target kind 2: configurable-list widget with a tail dropdown line ──
          # Line: "<label>:dropdown:<comma options>[:placeholder]" (general closeout
          # ends ",NOT LISTED"; XNA/SGF/LIT/DFW carry a trailing ":Please Select"
          # placeholder and no NOT LISTED; CMH has both). apply_options preserves
          # NOT LISTED; the placeholder segment rides along in `trailing`.
          def do_widget(form_id, qid, line_label):
              url = f"{BASE}/form/{form_id}/question/{qid}?apiKey={KEY}"
              r = requests.get(url, timeout=30); r.raise_for_status()
              fields_raw = r.json().get("content", {}).get("fields", "")
              if not fields_raw:
                  raise RuntimeError("widget 'fields' property is empty — format changed?")
              lines = fields_raw.replace("\r\n", "\n").split("\n")
              idx = next((i for i, ln in enumerate(lines)
                          if re.match(rf'^\*?\s*{re.escape(line_label)}\s*:\s*dropdown\s*:', ln, re.I)), None)
              if idx is None:
                  raise RuntimeError(f"'{line_label}' dropdown line not found in widget fields")
              parts = lines[idx].split(":")          # options contain no colons
              label, ftype, opts_raw = parts[0], parts[1], parts[2]
              trailing = parts[3:]                    # e.g. ["Please Select"]
              final, msg, changed = apply_options(dedupe(opts_raw.split(",")))
              if not changed:
                  return {"status": "noop", "message": msg}
              lines[idx] = ":".join([label, ftype, ",".join(final)] + trailing)
              r = requests.post(url, data={"question[fields]": "\n".join(lines)}, timeout=30)
              r.raise_for_status()
              return {"status": "ok", "message": msg}

          # key, label, handler, *args — add_tail and remove_tail hit the SAME set.
          TARGETS = [
              ("envoy_debrief", "Envoy Debrief form",  do_dropdown, "222916997891173", "53"),
              ("dfw_debrief",   "DFW Debrief form",    do_dropdown, "222277068943160", "51"),
              ("closeout",      "Commercial Closeout", do_widget,   "222916060752150", "45", "Tail Number"),
              ("cmh",           "CMH Closeout",        do_widget,   "261664495134058", "6",  "Tail Number"),
              ("xna",           "XNA Closeout",        do_widget,   "261954357644972", "6",  "Tail Number"),
              ("sgf",           "SGF Closeout",        do_widget,   "261954499086979", "6",  "Tail Number"),
              ("lit",           "LIT Closeout",        do_widget,   "261955038475971", "6",  "Tail Number"),
              ("dfw_closeout",  "DFW Closeout",        do_widget,   "261755203398967", "6",  "Tail Number"),
          ]

          result = {"tail": tail, "action": action,
                    "timestamp": datetime.now(timezone.utc).isoformat(timespec="seconds")}
          for key_name, label, fn, *args in TARGETS:
              try:
                  result[key_name] = fn(*args)
              except Exception as e:
                  result[key_name] = {"status": "error", "message": str(e)[:200]}
              print(f"{label}: {result[key_name]}")

          # ── SafetyCulture "Envoy Tails" global response set ──────
          # GET the set, add/remove the label, PUT it back. PUT preserves response
          # IDs by label-match, so add/remove/reorder never invalidates template
          # bindings or historical inspection answers.
          try:
              sc_key = os.environ["SAFETYCULTURE_KEY"]
              set_id = os.environ["ENVOY_TAILS_SET_ID"]
              H = {"Authorization": f"Bearer {sc_key}", "Content-Type": "application/json"}
              r = requests.get(f"https://api.safetyculture.io/response_sets/{set_id}", headers=H, timeout=30)
              r.raise_for_status()
              current = r.json()
              labels = [x["label"] for x in current.get("responses", [])]
              present = tail in (l.upper() for l in labels)
              if adding and present:
                  result["safetyculture"] = {"status": "noop", "message": f"already present ({len(labels)} total)"}
              elif not adding and not present:
                  result["safetyculture"] = {"status": "noop", "message": "not present"}
              else:
                  labels = (labels + [tail]) if adding else [l for l in labels if l.upper() != tail]
                  labels.sort(key=sort_key)
                  r = requests.put(
                      f"https://api.safetyculture.io/response_sets/{set_id}",
                      headers=H,
                      json={"name": current.get("name", "Envoy Tails"),
                            "responses": [{"label": l} for l in labels]},
                      timeout=30,
                  )
                  r.raise_for_status()
                  result["safetyculture"] = {"status": "ok", "message":
                      (f"added at position {labels.index(tail) + 1} of {len(labels)}"
                       if adding else f"removed ({len(labels)} remain)")}
              print(f"SafetyCulture: {result['safetyculture']}")
          except Exception as e:
              result["safetyculture"] = {"status": "error", "message": str(e)[:200]}
              print(f"SafetyCulture ERROR: {e}")

          # ── SharePoint Tail List row via Power Automate ──────────
          # add -> Add flow (appends the row, Status=Active); remove -> Remove flow
          # (sets Status=Disabled). Body {"tail": ...}. Skipped if the URL is unset.
          try:
              flow_url = os.environ.get("ENVOY_ROSTER_ADD_URL" if adding else "ENVOY_ROSTER_REMOVE_URL", "")
              if not flow_url:
                  result["sharepoint"] = {"status": "skipped", "message": "flow URL not configured"}
              else:
                  r = requests.post(flow_url, json={"tail": tail}, timeout=60)
                  r.raise_for_status()
                  result["sharepoint"] = {"status": "ok", "message":
                      "row added (Status=Active)" if adding else "Status=Disabled set"}
              print(f"SharePoint: {result['sharepoint']}")
          except Exception as e:
              result["sharepoint"] = {"status": "error", "message": str(e)[:200]}
              print(f"SharePoint ERROR: {e}")

          with open("envoy_fleet_action_result.json", "w") as f:
              json.dump(result, f, indent=2)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              icons = {"ok": "✅", "noop": "➖", "error": "❌", "skipped": "⏭"}
              rows = [(label, result[k]) for k, label, *_ in TARGETS]
              rows.append(("SafetyCulture (Envoy Tails)", result["safetyculture"]))
              rows.append(("SharePoint Tail List", result["sharepoint"]))
              with open(summary_path, "a") as f:
                  f.write(f"## {action}: `{tail}`\n\n| System | Status | Detail |\n|---|---|---|\n")
                  for label, s in rows:
                      f.write(f"| {label} | {icons.get(s['status'],'?')} {s['status']} | {s['message']} |\n")

          statuses = ([result["safetyculture"]["status"], result["sharepoint"]["status"]]
                      + [result[k]["status"] for k, *_ in TARGETS])
          if all(s == "error" for s in statuses):
              sys.exit(1)
          PYEOF

      - name: Commit result file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add envoy_fleet_action_result.json
          git diff --cached --quiet || git commit -m "chore: ${{ github.event.inputs.action }} ${{ github.event.inputs.tail }} [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          n=0
          until git push; do
            n=$((n+1)); [ "$n" -ge 3 ] && exit 1
            echo "push rejected (concurrent bot commit) — rebasing and retrying ($n/3)"
            git pull --rebase
          done

      - name: Trigger tracker refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run data_refresh.yml --repo "$GITHUB_REPOSITORY"
