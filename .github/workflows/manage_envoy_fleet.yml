name: Manage Envoy Fleet

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform: add_tail"
        required: true
        type: string
      tail:
        description: "Tail number (dashboard normalizes + validates; workflow re-checks defensively)"
        required: true
        type: string

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fleet action
        env:
          ACTION:       ${{ github.event.inputs.action }}
          TAIL_INPUT:   ${{ github.event.inputs.tail }}
          JOTFORM_KEY:  ${{ secrets.JOTFORM_KEY }}
          JOTFORM_BASE: https://foxtrotaviation.jotform.com/API
        run: |
          python3 - << 'PYEOF'
          import json, os, re, sys
          from datetime import datetime, timezone
          import requests

          action = os.environ["ACTION"].strip()
          tail   = os.environ["TAIL_INPUT"].strip().upper()

          if action != "add_tail":
              print(f"Unsupported action: {action}", file=sys.stderr); sys.exit(1)
          if not re.match(r'^N\d{1,5}[A-Z]{0,2}$', tail):
              print(f"Invalid tail format: {tail!r}", file=sys.stderr); sys.exit(1)

          print(f"Action: {action}  |  Tail: {tail}")

          KEY  = os.environ["JOTFORM_KEY"]
          BASE = os.environ["JOTFORM_BASE"]

          def sort_key(t):
              # Numeric portion after 'N' first (so N205 lands between N204 and
              # N206, not after N1999); non-N entries sort to the end.
              m = re.match(r'^N(\d+)', t.upper())
              return (0, int(m.group(1)), t.upper()) if m else (1, 0, t.upper())

          def insert_sorted(options, new_tail):
              """Insert into an option list, deduping (case-insensitive) and
              keeping a NOT LISTED entry (any casing) as the final option.
              Returns (new_list, position, already_present)."""
              seen, cleaned = set(), []
              for o in options:
                  o = o.strip()
                  if o and o.upper() not in seen:
                      seen.add(o.upper())
                      cleaned.append(o)
              nl = next((o for o in cleaned if o.upper() == "NOT LISTED"), None)
              others = [o for o in cleaned if o.upper() != "NOT LISTED"]
              if new_tail in (o.upper() for o in others):
                  return None, None, True
              others.append(new_tail)
              others.sort(key=sort_key)
              final = others + ([nl] if nl else [])
              return final, others.index(new_tail) + 1, False

          # ── Target 1 kind: plain dropdown question (pipe-separated options)
          def add_to_dropdown(form_id, qid):
              url = f"{BASE}/form/{form_id}/question/{qid}?apiKey={KEY}"
              r = requests.get(url, timeout=30); r.raise_for_status()
              opts_raw = r.json().get("content", {}).get("options", "")
              opts = opts_raw.split("|") if opts_raw else []
              final, pos, present = insert_sorted(opts, tail)
              if present:
                  return {"status": "noop", "message": f"already present ({len(opts)} options)"}
              r = requests.post(url, data={"question[options]": "|".join(final)}, timeout=30)
              r.raise_for_status()
              return {"status": "ok", "message": f"added at position {pos} of {len(final)}"}

          # ── Target 2 kind: configurable-list widget with a tail dropdown line.
          # Line format: "<label>:dropdown:<comma-separated options>[:placeholder]"
          # (general closeout ends ",NOT LISTED"; XNA/SGF/LIT carry a trailing
          # ":Please Select" placeholder segment and no NOT LISTED; CMH has both).
          def add_to_widget(form_id, qid, line_label):
              url = f"{BASE}/form/{form_id}/question/{qid}?apiKey={KEY}"
              r = requests.get(url, timeout=30); r.raise_for_status()
              fields_raw = r.json().get("content", {}).get("fields", "")
              if not fields_raw:
                  raise RuntimeError("widget 'fields' property is empty — format changed?")
              lines = fields_raw.replace("\r\n", "\n").split("\n")
              idx = next((i for i, ln in enumerate(lines)
                          if re.match(rf'^\*?\s*{re.escape(line_label)}\s*:\s*dropdown\s*:', ln, re.I)), None)
              if idx is None:
                  raise RuntimeError(f"'{line_label}' dropdown line not found in widget fields")
              parts = lines[idx].split(":")          # options contain no colons
              label, ftype, opts_raw = parts[0], parts[1], parts[2]
              trailing = parts[3:]                    # e.g. ["Please Select"]
              final, pos, present = insert_sorted(opts_raw.split(","), tail)
              if present:
                  return {"status": "noop", "message": "already present"}
              lines[idx] = ":".join([label, ftype, ",".join(final)] + trailing)
              r = requests.post(url, data={"question[fields]": "\n".join(lines)}, timeout=30)
              r.raise_for_status()
              return {"status": "ok", "message": f"added at position {pos} of {len(final)}"}

          TARGETS = [
              ("envoy_debrief", "Envoy Debrief form",  lambda: add_to_dropdown("222916997891173", "53")),
              ("dfw_debrief",   "DFW Debrief form",    lambda: add_to_dropdown("222277068943160", "51")),
              ("closeout",      "Commercial Closeout", lambda: add_to_widget("222916060752150", "45", "Tail Number")),
              ("cmh",           "CMH Closeout",        lambda: add_to_widget("261664495134058", "6",  "Tail Number")),
              ("xna",           "XNA Closeout",        lambda: add_to_widget("261954357644972", "6",  "Tail Number")),
              ("sgf",           "SGF Closeout",        lambda: add_to_widget("261954499086979", "6",  "Tail Number")),
              ("lit",           "LIT Closeout",        lambda: add_to_widget("261955038475971", "6",  "Tail Number")),
          ]

          result = {
              "tail": tail,
              "action": action,
              "timestamp": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              # SharePoint Tail List is appended by the Power Automate flow that
              # dispatched this workflow, so the workflow doesn't touch it.
          }
          for key_name, label, fn in TARGETS:
              try:
                  result[key_name] = fn()
              except Exception as e:
                  result[key_name] = {"status": "error", "message": str(e)[:200]}
              print(f"{label}: {result[key_name]}")

          with open("envoy_fleet_action_result.json", "w") as f:
              json.dump(result, f, indent=2)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(f"## {action}: `{tail}`\n\n| System | Status | Detail |\n|---|---|---|\n")
                  for key_name, label, _ in TARGETS:
                      s = result[key_name]
                      icon = {"ok":"✅","noop":"➖","error":"❌"}.get(s["status"], "?")
                      f.write(f"| {label} | {icon} {s['status']} | {s['message']} |\n")

          if all(result[k]["status"] == "error" for k, _, _ in TARGETS):
              sys.exit(1)
          PYEOF

      - name: Commit result file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add envoy_fleet_action_result.json
          git diff --cached --quiet || git commit -m "chore: ${{ github.event.inputs.action }} ${{ github.event.inputs.tail }} [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          n=0
          until git push; do
            n=$((n+1)); [ "$n" -ge 3 ] && exit 1
            echo "push rejected (concurrent bot commit) — rebasing and retrying ($n/3)"
            git pull --rebase
          done
