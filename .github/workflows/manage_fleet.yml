name: Manage PSA Fleet

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform: add_tail | remove_tail"
        required: true
        type: string
      tail:
        description: "Tail number (dashboard normalizes + validates; workflow re-checks defensively)"
        required: true
        type: string

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fleet action
        env:
          ACTION:              ${{ github.event.inputs.action }}
          TAIL_INPUT:          ${{ github.event.inputs.tail }}
          SAFETYCULTURE_KEY:   ${{ secrets.SAFETYCULTURE_KEY }}
          JOTFORM_KEY:         ${{ secrets.JOTFORM_KEY }}
          PSA_TAILS_SET_ID:    responseset_0602a202a6a2458cae66ab6b46640d28
          JOTFORM_BASE:        https://foxtrotaviation.jotform.com/API
          JOTFORM_FORM_ID:     "213263365115146"
          JOTFORM_TAIL_QID:    "53"
          CLOSEOUT_FORM_ID:    "222916060752150"
          CLOSEOUT_PSA_QID:    "27"
        run: |
          python3 - << 'PYEOF'
          import json, os, re, sys
          from datetime import datetime, timezone
          import requests

          action = os.environ["ACTION"].strip()
          tail   = os.environ["TAIL_INPUT"].strip().upper()

          if action not in ("add_tail", "remove_tail"):
              print(f"Unsupported action: {action}", file=sys.stderr); sys.exit(1)
          if not re.match(r'^N\d{1,5}[A-Z]{0,2}$', tail):
              print(f"Invalid tail format: {tail!r}", file=sys.stderr); sys.exit(1)

          print(f"Action: {action}  |  Tail: {tail}")

          # remove_tail: the PA flow performs the SharePoint Status=Disabled
          # update itself; the dropdown lists intentionally keep the tail for
          # historical debriefs. This workflow just records the action (and the
          # follow-up step dispatches a tracker refresh so it drops off fast).
          if action == "remove_tail":
              result = {
                  "tail": tail, "action": action,
                  "timestamp": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                  "sharepoint": {"status": "ok", "message": "Status=Disabled set by the PA flow; tracker refresh dispatched"},
              }
              with open("fleet_action_result.json", "w") as f:
                  json.dump(result, f, indent=2)
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  with open(sp, "a") as f:
                      f.write(f"## remove_tail: `{tail}`" + chr(10) + chr(10)
                              + "Status=Disabled handled by the PA flow; tracker refresh dispatched." + chr(10))
              sys.exit(0)

          def sort_key(t):
              # Sort tails by numeric portion after 'N' (so N205 falls between
              # N204 and N206 instead of after N1999). Non-N entries sort to end.
              m = re.match(r'^N(\d+)', t.upper())
              return (0, int(m.group(1)), t.upper()) if m else (1, 0, t.upper())

          result = {
              "tail": tail,
              "action": action,
              "timestamp": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "safetyculture": {"status": "skipped", "message": ""},
              "jotform":       {"status": "skipped", "message": ""},
              "closeout":      {"status": "skipped", "message": ""},
              # SharePoint is handled by the Power Automate flow directly (after
              # it dispatches this workflow), so the workflow doesn't touch it.
          }

          # ── 1. SafetyCulture ─────────────────────────────────────
          try:
              key    = os.environ["SAFETYCULTURE_KEY"]
              set_id = os.environ["PSA_TAILS_SET_ID"]
              H = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}
              r = requests.get(f"https://api.safetyculture.io/response_sets/{set_id}", headers=H, timeout=30)
              r.raise_for_status()
              current = r.json()
              labels = [x["label"] for x in current.get("responses", [])]
              if tail in labels:
                  result["safetyculture"] = {"status": "noop", "message": f"already present ({len(labels)} total)"}
              else:
                  labels.append(tail)
                  labels.sort(key=sort_key)
                  r = requests.put(
                      f"https://api.safetyculture.io/response_sets/{set_id}",
                      headers=H,
                      json={"name": current.get("name", "PSA Tails"),
                            "responses": [{"label": l} for l in labels]},
                      timeout=30,
                  )
                  r.raise_for_status()
                  pos = labels.index(tail) + 1
                  result["safetyculture"] = {"status": "ok", "message": f"added at position {pos} of {len(labels)}"}
              print(f"SafetyCulture: {result['safetyculture']}")
          except Exception as e:
              result["safetyculture"] = {"status": "error", "message": str(e)[:200]}
              print(f"SafetyCulture ERROR: {e}")

          # ── 2. JotForm ──────────────────────────────────────────
          try:
              key     = os.environ["JOTFORM_KEY"]
              base    = os.environ["JOTFORM_BASE"]
              form_id = os.environ["JOTFORM_FORM_ID"]
              qid     = os.environ["JOTFORM_TAIL_QID"]
              r = requests.get(f"{base}/form/{form_id}/question/{qid}?apiKey={key}", timeout=30)
              r.raise_for_status()
              opts_raw = r.json().get("content", {}).get("options", "")
              opts = opts_raw.split("|") if isinstance(opts_raw, str) and opts_raw else []
              had_not_listed = "Not Listed" in opts
              others = [o for o in opts if o != "Not Listed"]
              if tail in others:
                  result["jotform"] = {"status": "noop", "message": f"already present ({len(opts)} total)"}
              else:
                  others.append(tail)
                  others.sort(key=sort_key)
                  final = others + (["Not Listed"] if had_not_listed else [])
                  r = requests.post(
                      f"{base}/form/{form_id}/question/{qid}?apiKey={key}",
                      data={"question[options]": "|".join(final)},
                      timeout=30,
                  )
                  r.raise_for_status()
                  pos = final.index(tail) + 1
                  result["jotform"] = {"status": "ok", "message": f"added at position {pos} of {len(final)}"}
              print(f"JotForm: {result['jotform']}")
          except Exception as e:
              result["jotform"] = {"status": "error", "message": str(e)[:200]}
              print(f"JotForm ERROR: {e}")

          # ── 3. Commercial Closeout PSA Tail Dropdown ────────────
          # Q27 ("PSA Fleet") on Commercial Closeout 2.0 is a Configurable
          # List widget. Its column definitions live in the question's
          # "fields" property, one line per column; the tail dropdown is the
          # line "Dropdown:dropdown:<comma-separated options>". "NOT LISTED"
          # stays as the final option, mirroring Q53's "Not Listed" handling.
          try:
              key     = os.environ["JOTFORM_KEY"]
              base    = os.environ["JOTFORM_BASE"]
              form_id = os.environ["CLOSEOUT_FORM_ID"]
              qid     = os.environ["CLOSEOUT_PSA_QID"]
              r = requests.get(f"{base}/form/{form_id}/question/{qid}?apiKey={key}", timeout=30)
              r.raise_for_status()
              fields_raw = r.json().get("content", {}).get("fields", "")
              if not fields_raw:
                  raise RuntimeError("widget 'fields' property is empty — format changed?")

              lines = fields_raw.replace("\r\n", "\n").split("\n")
              # The tail column: label "Dropdown", type dropdown
              tail_idx = next((i for i, ln in enumerate(lines)
                               if re.match(r'^\*?\s*Dropdown\s*:\s*dropdown\s*:', ln, re.I)), None)
              if tail_idx is None:
                  raise RuntimeError("tail dropdown line not found in widget fields")

              label, ftype, opts_raw = lines[tail_idx].split(":", 2)
              opts, seen = [], set()
              for o in opts_raw.split(","):
                  o = o.strip()
                  if o and o.upper() not in seen:
                      seen.add(o.upper())
                      opts.append(o)
              had_not_listed = any(o.upper() == "NOT LISTED" for o in opts)
              others = [o for o in opts if o.upper() != "NOT LISTED"]

              if tail in (o.upper() for o in others):
                  result["closeout"] = {"status": "noop", "message": f"already present ({len(others)} tails)"}
              else:
                  others.append(tail)
                  others.sort(key=sort_key)
                  final = others + (["NOT LISTED"] if had_not_listed else [])
                  lines[tail_idx] = f"{label}:{ftype}:{','.join(final)}"
                  r = requests.post(
                      f"{base}/form/{form_id}/question/{qid}?apiKey={key}",
                      data={"question[fields]": "\n".join(lines)},
                      timeout=30,
                  )
                  r.raise_for_status()
                  pos = final.index(tail) + 1
                  result["closeout"] = {"status": "ok", "message": f"added at position {pos} of {len(final)}"}
              print(f"Closeout: {result['closeout']}")
          except Exception as e:
              result["closeout"] = {"status": "error", "message": str(e)[:200]}
              print(f"Closeout ERROR: {e}")

          # ── Write result file ────────────────────────────────────
          with open("fleet_action_result.json", "w") as f:
              json.dump(result, f, indent=2)

          # ── Job summary ──────────────────────────────────────────
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(f"## {action}: `{tail}`\n\n")
                  f.write("| System | Status | Detail |\n|---|---|---|\n")
                  for k in ("safetyculture", "jotform", "closeout"):
                      s = result[k]
                      icon = {"ok":"✅","noop":"➖","error":"❌","skipped":"⏭"}.get(s["status"], "?")
                      f.write(f"| {k} | {icon} {s['status']} | {s['message']} |\n")

          if all(result[k]["status"] == "error" for k in ("safetyculture","jotform","closeout")):
              sys.exit(1)
          PYEOF

      - name: Commit result file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fleet_action_result.json
          git diff --cached --quiet || git commit -m "chore: ${{ github.event.inputs.action }} ${{ github.event.inputs.tail }} [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          n=0
          until git push; do
            n=$((n+1)); [ "$n" -ge 3 ] && exit 1
            echo "push rejected (concurrent bot commit) — rebasing and retrying ($n/3)"
            git pull --rebase
          done

      - name: Trigger tracker refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run psa_data_refresh.yml --repo "$GITHUB_REPOSITORY"
