name: PSA Daily Compliance Report

on:
  # No native cron (Sam, 2026-08-28): the platform's dispatcher fires this
  # at 9:07 AM Eastern from Monitoring/schedules.json (dispatch bypasses the
  # script's 9-AM schedule guard, and the dispatcher already fires at the
  # right Eastern time year-round).
  workflow_dispatch:
    inputs:
      recipients:
        description: "Override recipients (comma-separated) — for testing"
        required: false
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Refresh PSA data
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python psa_generate_data.py

      - name: Build and send report
        env:
          TENANT_ID:           ${{ secrets.TENANT_ID }}
          CLIENT_ID:           ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:       ${{ secrets.CLIENT_SECRET }}
          RECIPIENTS_OVERRIDE: ${{ inputs.recipients }}
        run: python psa_daily_report.py
