name: PSA Compliance Data Refresh

on:
  # No native cron (Sam, 2026-08-28): the platform's dispatcher fires this
  # hourly at :17 from Monitoring/schedules.json.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Check source freshness
        id: src
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python3 check_source_modified.py "Power Flows/Debriefs/PSA Debriefs.xlsx" refresh_state/psa.mtime

      - name: Set up Python
        if: steps.src.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.src.outputs.changed == 'true'
        run: pip install openpyxl requests

      - name: Run PSA data relay
        if: steps.src.outputs.changed == 'true'
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python psa_generate_data.py

      - name: Record source watermark
        if: steps.src.outputs.changed == 'true'
        run: |
          mkdir -p refresh_state
          printf '%s' "${{ steps.src.outputs.mtime }}" > refresh_state/psa.mtime

      - name: Commit and push psa_data.json
        if: steps.src.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add psa_data.json refresh_state/psa.mtime
          git diff --cached --quiet || git commit -m "chore: refresh psa_data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          n=0
          until git push; do
            n=$((n+1)); [ "$n" -ge 3 ] && exit 1
            echo "push rejected (concurrent bot commit) — rebasing and retrying ($n/3)"
            git pull --rebase
          done
