name: TEMP Tail Membership Check

on:
  workflow_dispatch:
    inputs:
      tails:
        description: "Comma-separated tails to check"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check membership across all Envoy JotForm lists
        env:
          JOTFORM_KEY: ${{ secrets.JOTFORM_KEY }}
          TAILS: ${{ github.event.inputs.tails }}
        run: |
          pip -q install requests
          python3 - << 'PYEOF'
          import os, re, requests
          key = os.environ["JOTFORM_KEY"]
          base = "https://foxtrotaviation.jotform.com/API"
          tails = [t.strip().upper() for t in os.environ["TAILS"].split(",") if t.strip()]

          def dropdown_opts(fid, qid):
              r = requests.get(f"{base}/form/{fid}/question/{qid}?apiKey={key}", timeout=30)
              r.raise_for_status()
              return {o.strip().upper() for o in r.json()["content"].get("options", "").split("|")}

          def widget_opts(fid, qid):
              r = requests.get(f"{base}/form/{fid}/question/{qid}?apiKey={key}", timeout=30)
              r.raise_for_status()
              fields = r.json()["content"].get("fields", "").replace("\r\n", "\n")
              for ln in fields.split("\n"):
                  if re.match(r'^\*?\s*Tail Number\s*:\s*dropdown\s*:', ln, re.I):
                      opts = ln.split(":")[2]
                      return {o.strip().upper() for o in opts.split(",")}
              return set()

          LISTS = [
              ("Envoy Debrief",  dropdown_opts("222916997891173", "53")),
              ("DFW Debrief",    dropdown_opts("222277068943160", "51")),
              ("Comm Closeout",  widget_opts("222916060752150", "45")),
              ("CMH Closeout",   widget_opts("261664495134058", "6")),
              ("XNA Closeout",   widget_opts("261954357644972", "6")),
              ("SGF Closeout",   widget_opts("261954499086979", "6")),
              ("LIT Closeout",   widget_opts("261955038475971", "6")),
          ]
          for t in tails:
              missing = [name for name, opts in LISTS if t not in opts]
              print(f"{t}: {'present everywhere' if not missing else 'MISSING from: ' + ', '.join(missing)}")
          PYEOF
