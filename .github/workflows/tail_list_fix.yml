name: TEMP Tail List Dupe Fix

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate N550NN row from Tail List Table3
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          pip -q install requests
          python3 - << 'PYEOF'
          import os, sys, requests
          from urllib.parse import quote

          DRIVE_ID = "b!_bzXaIx86kOufgJN3ih-BaDIDthKYuxJkJtLi1Bm5irGjCEnK-VHSpBRRm3_SDKU"
          SP_PATH  = "Power Flows/Debriefs/PSA Debriefs.xlsx"
          TABLE    = "Table3"

          r = requests.post(
              f"https://login.microsoftonline.com/{os.environ['TENANT_ID']}/oauth2/v2.0/token",
              data={"grant_type": "client_credentials", "client_id": os.environ["CLIENT_ID"],
                    "client_secret": os.environ["CLIENT_SECRET"],
                    "scope": "https://graph.microsoft.com/.default"}, timeout=30)
          r.raise_for_status()
          H = {"Authorization": f"Bearer {r.json()['access_token']}"}

          encoded = "/".join(quote(seg) for seg in SP_PATH.split("/"))
          wb = f"https://graph.microsoft.com/v1.0/drives/{DRIVE_ID}/root:/{encoded}:/workbook"

          rows = requests.get(f"{wb}/tables/{TABLE}/rows?$select=index,values", headers=H, timeout=60)
          rows.raise_for_status()
          hits = [row["index"] for row in rows.json()["value"]
                  if str(row["values"][0][0]).strip().upper() == "N550NN"]
          print(f"N550NN found at table row indexes: {hits}")
          if len(hits) < 2:
              print("No duplicate present — nothing to do."); sys.exit(0)

          # Delete the later occurrence (keep the first)
          victim = hits[-1]
          d = requests.delete(f"{wb}/tables/{TABLE}/rows/itemAt(index={victim})", headers=H, timeout=60)
          d.raise_for_status()
          print(f"Deleted row at index {victim} (status {d.status_code})")

          # Verify
          rows = requests.get(f"{wb}/tables/{TABLE}/rows?$select=index,values", headers=H, timeout=60)
          rows.raise_for_status()
          vals = [str(row["values"][0][0]).strip().upper() for row in rows.json()["value"]]
          print(f"After: {len(vals)} rows, N550NN count = {vals.count('N550NN')}")
          assert vals.count("N550NN") == 1
          print("VERIFIED")
          PYEOF
