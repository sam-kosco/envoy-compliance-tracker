name: TMP Discover Tail Questions
on: workflow_dispatch
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          JOTFORM_KEY: ${{ secrets.JOTFORM_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, requests
          KEY = os.environ["JOTFORM_KEY"]; BASE = "https://foxtrotaviation.jotform.com/API"
          r = requests.get(f"{BASE}/user/forms?apiKey={KEY}&limit=200&filter=%7B%22status%22%3A%22ENABLED%22%7D", timeout=30)
          r.raise_for_status()
          forms = r.json().get("content", [])
          print(f"enabled forms: {len(forms)}")
          hits = [f for f in forms if "mesa" in (f.get("title","") or "").lower()]
          for f in forms:
              print("  ", f["id"], f.get("title","")[:60])
          for f in hits:
              fid = f["id"]
              r = requests.get(f"{BASE}/form/{fid}/questions?apiKey={KEY}", timeout=30)
              r.raise_for_status()
              print(f"\n===== MESA MATCH: {f.get('title')} ({fid}) =====")
              for qid, q in sorted(r.json().get("content", {}).items(), key=lambda x: int(x[0])):
                  t = q.get("type","")
                  if t not in ("control_dropdown","control_widget"): continue
                  print(f"  Q{qid} [{t}] {(q.get('text','') or '')[:60]!r}")
                  opts = str(q.get("options","") or ""); flds = str(q.get("fields","") or "")
                  if opts:
                      o = opts.split("|"); print(f"      options({len(o)}): {o[:3]}...{o[-2:]}")
                  for ln in flds.replace("\r\n","\n").split("\n"):
                      if not ln.strip(): continue
                      seg = ln.split(":")
                      print(f"      line: {seg[0]}:{seg[1] if len(seg)>1 else ''}: "
                            f"[{len(seg[2].split(',')) if len(seg)>2 and seg[2] else 0} opts] "
                            f"{seg[2].split(',')[:3] if len(seg)>2 else ''} trail={':'.join(seg[3:])!r}")
          PYEOF
