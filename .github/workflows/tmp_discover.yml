name: TMP Discover Tail Questions
on: workflow_dispatch
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          SAFETYCULTURE_KEY: ${{ secrets.SAFETYCULTURE_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, json
          H = {"Authorization": "Bearer " + os.environ["SAFETYCULTURE_KEY"]}
          r = requests.get("https://api.safetyculture.io/response_sets", headers=H, timeout=30)
          r.raise_for_status()
          data = r.json()
          sets = data if isinstance(data, list) else (data.get("response_sets") or data.get("items") or [])
          for s in sets:
              print(json.dumps({k: s.get(k) for k in ("responseset_id","id","name") if s.get(k)}))
          PYEOF
