name: TMP Discover Tail Questions
on: workflow_dispatch
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          JOTFORM_KEY: ${{ secrets.JOTFORM_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, requests
          KEY = os.environ["JOTFORM_KEY"]; BASE = "https://foxtrotaviation.jotform.com/API"
          r = requests.get(f"{BASE}/form/222916060752150/questions?apiKey={KEY}", timeout=30)
          r.raise_for_status()
          for qid, q in sorted(r.json().get("content", {}).items(), key=lambda x: int(x[0])):
              txt = (q.get("text","") or "")
              if "mesa" not in txt.lower() and "mesa" not in str(q.get("name","")).lower():
                  continue
              print(f"Q{qid} [{q.get('type','')}] {txt[:70]!r}")
              for ln in str(q.get("fields","") or "").replace("\r\n","\n").split("\n"):
                  if not ln.strip(): continue
                  seg = ln.split(":")
                  print(f"   line: {seg[0]!r} type={seg[1] if len(seg)>1 else ''!r} "
                        f"opts={len(seg[2].split(',')) if len(seg)>2 and seg[2] else 0} "
                        f"first={seg[2].split(',')[:3] if len(seg)>2 else ''} trail={':'.join(seg[3:])!r}")
          PYEOF
