name: TMP DFW Widebody Tails
on: workflow_dispatch
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          AERO_API_KEY: ${{ secrets.AERO_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, time, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo
          KEY = os.environ["AERO_API_KEY"]
          H = {"x-apikey": KEY}
          BASE = "https://aeroapi.flightaware.com/aeroapi"
          CT = ZoneInfo("America/Chicago")
          # 1) history endpoint probe for the pre-Sep-27 Lufthansa dates
          r = requests.get(f"{BASE}/history/flights/DLH438",
                           params={"start": "2026-09-19", "end": "2026-09-27"},
                           headers=H, timeout=30)
          print("history DLH438:", r.status_code)
          if r.status_code == 200:
              for f in r.json().get("flights", []):
                  ts = f.get("actual_in") or f.get("scheduled_in")
                  loc = (datetime.fromisoformat(ts.replace("Z","+00:00")).astimezone(CT)
                         .strftime("%b %d %a %H:%M") if ts else "?")
                  print(f"  {loc}  reg={f.get('registration')} type={f.get('aircraft_type')} "
                        f"dest={(f.get('destination') or {}).get('code')} "
                        f"cancelled={f.get('cancelled')}")
          else:
              print("  body:", r.text[:300])
          time.sleep(7)
          # 2) Sep 30 anomaly: all DLH438 legs Sep 29 - Oct 1 incl. cancellations
          r = requests.get(f"{BASE}/flights/DLH438",
                           params={"start": "2026-09-29", "end": "2026-10-02"},
                           headers=H, timeout=30)
          print("flights DLH438 Sep29-Oct1:", r.status_code)
          if r.status_code == 200:
              for f in r.json().get("flights", []):
                  ts = f.get("scheduled_out") or f.get("scheduled_off")
                  loc = (datetime.fromisoformat(ts.replace("Z","+00:00")).astimezone(CT)
                         .strftime("%b %d %H:%M") if ts else "?")
                  print(f"  sched_out(CT)={loc} reg={f.get('registration')} "
                        f"dest={(f.get('destination') or {}).get('code')} "
                        f"cancelled={f.get('cancelled')} diverted={f.get('diverted')}")
          else:
              print("  body:", r.text[:300])
          PYEOF
